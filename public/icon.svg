<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Mihrab / Dome arch silhouette -->
  <path d="M 180 370 L 180 250 C 180 180, 256 140, 256 140 C 256 140, 332 180, 332 250 L 332 370 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" />

  <!-- Crescent Moon -->
  <path d="M 270 190 A 45 45 0 1 1 225 250 A 35 35 0 1 0 270 190 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  
  <!-- Star -->
  <polygon points="275,215 279,224 289,225 281,232 284,242 275,236 266,242 269,232 261,225 271,224" fill="url(#goldGrad)" />

  <!-- Tasbih / Beads arc at bottom -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <circle cx="200" cy="340" r="7" />
    <circle cx="222" cy="348" r="7" />
    <circle cx="245" cy="352" r="7" />
    <circle cx="267" cy="352" r="7" />
    <circle cx="290" cy="348" r="7" />
    <circle cx="312" cy="340" r="7" />
  </g>

  <!-- Islamic prayer lines -->
  <line x1="210" y1="310" x2="302" y2="310" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="225" y1="290" x2="287" y2="290" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
