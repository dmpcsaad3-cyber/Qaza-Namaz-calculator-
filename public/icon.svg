<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Carpet Fabric Gradient -->
    <linearGradient id="matGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Decorative Border -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.3" />

  <!-- ================= PRAYER MAT (JANAMAZ) ================= -->
  <!-- Top Fringe Tassels -->
  <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="150" y1="70" x2="150" y2="82" />
    <line x1="168" y1="70" x2="168" y2="82" />
    <line x1="186" y1="70" x2="186" y2="82" />
    <line x1="204" y1="70" x2="204" y2="82" />
    <line x1="222" y1="70" x2="222" y2="82" />
    <line x1="240" y1="70" x2="240" y2="82" />
    <line x1="256" y1="68" x2="256" y2="82" />
    <line x1="272" y1="70" x2="272" y2="82" />
    <line x1="290" y1="70" x2="290" y2="82" />
    <line x1="308" y1="70" x2="308" y2="82" />
    <line x1="326" y1="70" x2="326" y2="82" />
    <line x1="344" y1="70" x2="344" y2="82" />
    <line x1="362" y1="70" x2="362" y2="82" />
  </g>

  <!-- Prayer Mat Body -->
  <rect x="136" y="82" width="240" height="348" rx="16" fill="url(#matGrad)" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Prayer Mat Inner Border -->
  <rect x="150" y="96" width="212" height="320" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.7" />

  <!-- Mihrab Arch (Dome shape on the Janamaz) -->
  <path d="M 172 380 L 172 230 C 172 165, 256 125, 256 125 C 256 125, 340 165, 340 230 L 340 380 Z" 
        fill="#022c22" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />

  <!-- Inner Mihrab Outline -->
  <path d="M 186 370 L 186 238 C 186 182, 256 148, 256 148 C 256 148, 326 182, 326 238 L 326 370" 
        fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="6 4" stroke-opacity="0.8" />

  <!-- Hanging Mosque Lantern / Lamp from the Arch -->
  <line x1="256" y1="148" x2="256" y2="195" stroke="url(#goldGrad)" stroke-width="2" />
  <!-- Lantern Body -->
  <polygon points="256,195 264,204 261,218 251,218 248,204" fill="url(#goldGrad)" filter="url(#softGlow)" />
  <circle cx="256" cy="224" r="3" fill="url(#goldGrad)" />

  <!-- Central Star / Crescent in Mihrab -->
  <path d="M 268 250 A 30 30 0 1 1 238 290 A 24 24 0 1 0 268 250 Z" fill="url(#goldGrad)" filter="url(#softGlow)" />
  <polygon points="272,268 275,274 282,275 277,280 279,287 272,283 265,287 267,280 262,275 269,274" fill="url(#goldGrad)" />

  <!-- Islamic Geometric Pattern Lines at base of mat -->
  <path d="M 210 335 L 256 315 L 302 335 L 256 355 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.75" />
  <circle cx="256" cy="335" r="5" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Bottom Fringe Tassels -->
  <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="150" y1="430" x2="150" y2="442" />
    <line x1="168" y1="430" x2="168" y2="442" />
    <line x1="186" y1="430" x2="186" y2="442" />
    <line x1="204" y1="430" x2="204" y2="442" />
    <line x1="222" y1="430" x2="222" y2="442" />
    <line x1="240" y1="430" x2="240" y2="442" />
    <line x1="256" y1="430" x2="256" y2="444" />
    <line x1="272" y1="430" x2="272" y2="442" />
    <line x1="290" y1="430" x2="290" y2="442" />
    <line x1="308" y1="430" x2="308" y2="442" />
    <line x1="326" y1="430" x2="326" y2="442" />
    <line x1="344" y1="430" x2="344" y2="442" />
    <line x1="362" y1="430" x2="362" y2="442" />
  </g>
</svg>
