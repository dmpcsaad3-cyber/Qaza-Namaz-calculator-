workflows:
  android-apk-release:
    name: Qaza e Umri Tracker - Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
      vars:
        JAVA_HOME: /Library/Java/JavaVirtualMachines/zulu-21.jdk/Contents/Home
    scripts:
      - name: Install dependencies
        script: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Build Web App & Sync Android
        script: |
          npm run build
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
      - name: Build Android Debug APK
        script: |
          if [ -d "/Library/Java/JavaVirtualMachines/zulu-21.jdk/Contents/Home" ]; then
            export JAVA_HOME="/Library/Java/JavaVirtualMachines/zulu-21.jdk/Contents/Home"
          elif [ -x "/usr/libexec/java_home" ]; then
            export JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null || /usr/libexec/java_home)
          elif [ -d "/usr/lib/jvm/java-21-openjdk-amd64" ]; then
            export JAVA_HOME="/usr/lib/jvm/java-21-openjdk-amd64"
          fi
          if [ -n "$JAVA_HOME" ]; then
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          echo "Active Java Version:"
          java -version
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - dmpcsaad3@gmail.com
        notify:
          success: true
          failure: true 